<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login — Forex Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


  <style>
    :root {
      --lime-main: #b9ff51;
      --gray-text: #334155;
      --gray-muted: #64748b;
      --border-soft: #e5e7eb;
    }

    body {
      background: #efffd6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--gray-text);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-xl p-8">
    
<a href="index.html"
  class="inline-flex items-center gap-2 text-sm text-slate-600
  hover:text-lime-600 mb-4 transition">
  ← Kembali ke Beranda
</a>

    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-6">
      <img src="logo.png" class="h-12 w-12 object-contain">
      <span class="text-2xl font-bold text-lime-600">Forex Academy</span>
    </div>

    <!-- Title -->
    <h1 class="text-xl font-semibold text-center mb-1">
      Masuk ke Akun
    </h1>
    <p class="text-sm text-center text-slate-500 mb-6">
      Silakan login untuk melanjutkan
    </p>

    <!-- Form -->
    <div class="space-y-4">

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-lime-400"
      >

      <input
        id="loginPass"
        type="password"
        placeholder="Password"
        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-lime-400"
      >

      <button
        onclick="login()"
        class="w-full py-3 bg-lime-500 hover:bg-lime-600 text-white font-semibold rounded-xl transition shadow">
        Login
      </button>

    </div>

    <!-- Register Link -->
    <p class="text-sm text-center text-slate-600 mt-6">
      Belum punya akun?
      <a href="register.html" class="text-lime-600 font-semibold hover:underline">
        Daftar sekarang
      </a>
    </p>

  </div>

  <!-- Firebase Login Script -->
  <script type="module">
  import { auth } from "./js/firebase.js";
  import { signInWithEmailAndPassword }
    from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

  window.login = async () => {
    const email = loginEmail.value.trim();
    const pass = loginPass.value;

    if (!email || !pass) {
      Swal.fire({
        toast: true,
        position: "top-end",
        icon: "warning",
        title: "Email dan password wajib diisi",
        showConfirmButton: false,
        timer: 2000
      });
      return;
    }

    try {
      await signInWithEmailAndPassword(auth, email, pass);

      Swal.fire({
        toast: true,
        position: "top-end",
        icon: "success",
        title: "Login berhasil",
        showConfirmButton: false,
        timer: 1500
      });

      setTimeout(() => {
        window.location.replace("dashboard/menu.html");
      }, 1500);

    } catch {
      Swal.fire({
        toast: true,
        position: "top-end",
        icon: "error",
        title: "Email atau password salah",
        showConfirmButton: false,
        timer: 2000
      });
    }
  };
</script>

</body>
</html>
