<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register — Forex Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #efffd6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-up {
      animation: fadeUp 0.4s ease-out both;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-white border rounded-2xl shadow-xl p-8">
    <a href="index.html"
  class="inline-flex items-center gap-2 text-sm text-slate-600
  hover:text-lime-600 mb-4 transition">
  ← Kembali ke Beranda
</a>
    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-6">
      <img src="logo.png" class="h-12 w-12 object-contain">
      <span class="text-2xl font-bold text-lime-600">Forex Academy</span>
    </div>

    <h1 class="text-xl font-semibold text-center mb-4">Buat Akun Baru</h1>
    <p class="text-sm text-center text-slate-500 mb-6">
      Silakan registrasi untuk membuat akun baru
    </p>

    <div class="space-y-4">
      <input id="regNama" type="text" placeholder="Nama Lengkap"
        class="w-full px-4 py-3 border rounded-xl">

      <input id="regEmail" type="email" placeholder="Email"
        class="w-full px-4 py-3 border rounded-xl">

      <input id="regPass" type="password" placeholder="Password (min 6 karakter)"
        class="w-full px-4 py-3 border rounded-xl">

      <button onclick="register()"
        class="w-full py-3 bg-lime-500 hover:bg-lime-600 text-white rounded-xl transition">
        Daftar Akun
      </button>
    </div>

    <p class="text-center mt-4 text-sm">
      Sudah punya akun?
      <a href="login.html" class="text-lime-600">Login</a>
    </p>
  </div>

  <!-- SUCCESS MODAL -->
  <div id="successModal"
    class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">

    <div class="bg-white rounded-2xl shadow-xl p-6 w-[90%] max-w-md
      text-center animate-fade-up">

      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-lime-100
        flex items-center justify-center">
        <svg class="w-8 h-8 text-lime-600" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M5 13l4 4L19 7" />
        </svg>
      </div>

      <h2 class="text-xl font-bold mb-2 text-slate-800">
        Akun Berhasil Dibuat
      </h2>

      <p class="text-slate-600 mb-6">
        Akun anda berhasil dibuat, Sekarang <br>masukan data akun anda ke form login
      </p>

      <button id="goLoginBtn"
        class="w-full bg-lime-500 hover:bg-lime-600 text-white py-3 rounded-xl font-semibold
        transition-all active:scale-95">
        Ke Halaman Login
      </button>

    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword }
      from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    // 🔥 KONFIGURASI FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDZLqNF840Rh4U0xtJ0SCsR0R6n_2RlKi4",
      authDomain: "forex-academy-du.firebaseapp.com",
      projectId: "forex-academy-du",
      storageBucket: "forex-academy-du.firebasestorage.app",
      messagingSenderId: "123449417052",
      appId: "1:123449417052:web:64e29a72e4890c86a2f599"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 🚀 REGISTER FUNCTION
    window.register = async () => {
      const nama = regNama.value.trim();
      const email = regEmail.value.trim();
      const pass = regPass.value;

      if (!nama || !email || !pass) {
        alert("Semua field wajib diisi");
        return;
      }

      try {
        const userCredential =
          await createUserWithEmailAndPassword(auth, email, pass);

        const user = userCredential.user;

        await setDoc(doc(db, "users", user.uid), {
          nama: nama,
          email: email,
          createdAt: serverTimestamp()
        });

        // ✅ TAMPILKAN MODAL SUKSES
        const modal = document.getElementById("successModal");
        modal.classList.remove("hidden");
        modal.classList.add("flex");

        document.getElementById("goLoginBtn").onclick = () => {
          window.location.href = "login.html";
        };

      } catch (err) {
        console.error(err);

        if (err.code === "auth/email-already-in-use") {
          alert("Email sudah terdaftar");
        } else if (err.code === "auth/weak-password") {
          alert("Password minimal 6 karakter");
        } else {
          alert("Registrasi gagal");
        }
      }
    };
  </script>

</body>
</html>
